<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>Agario Mobile</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  min-height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  background:#080b12;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
}

body{
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  background:
    radial-gradient(
      circle at center,
      #101827 0%,
      #080b12 70%
    );
}

#menu{
  position:fixed;
  inset:0;
  z-index:10;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:
    radial-gradient(
      circle at center,
      rgba(0,180,150,.12),
      rgba(0,0,0,.82) 65%
    );
}

.panel{
  width:min(420px,92vw);

  padding:30px 24px;

  border:1px solid rgba(0,255,210,.25);
  border-radius:24px;

  background:rgba(10,16,25,.94);

  box-shadow:
    0 0 50px rgba(0,255,200,.12),
    inset 0 0 30px rgba(255,255,255,.02);

  text-align:center;
}

.logo{
  font-size:42px;
  font-weight:900;
  letter-spacing:4px;

  color:#42ffd8;

  text-shadow:
    0 0 10px rgba(66,255,216,.8),
    0 0 35px rgba(66,255,216,.4);
}

.subtitle{
  margin-top:8px;
  margin-bottom:25px;

  color:#9ba8b8;
  font-size:14px;
}

input{
  width:100%;
  height:52px;

  padding:0 18px;

  border-radius:14px;
  border:1px solid rgba(255,255,255,.12);

  outline:none;

  background:#111a27;
  color:white;

  text-align:center;

  font-size:17px;

  margin-bottom:14px;
}

input:focus{
  border-color:#42ffd8;

  box-shadow:
    0 0 15px rgba(66,255,216,.15);
}

button{
  width:100%;
  height:52px;

  border:0;
  border-radius:14px;

  background:#42ffd8;
  color:#04110e;

  font-size:17px;
  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 0 25px rgba(66,255,216,.2);
}

button:active{
  transform:scale(.97);
}

#hud{
  position:fixed;
  z-index:5;

  top:14px;
  left:14px;
  right:14px;

  display:none;

  justify-content:space-between;

  pointer-events:none;
}

.hudBox{
  padding:10px 14px;

  border-radius:13px;

  background:rgba(5,10,16,.78);

  border:1px solid rgba(255,255,255,.1);

  font-size:13px;
}

.hudBox b{
  color:#42ffd8;
}

#rank{
  position:fixed;

  z-index:5;

  right:14px;
  top:70px;

  width:180px;

  padding:13px;

  display:none;

  border-radius:14px;

  background:rgba(5,10,16,.78);

  border:1px solid rgba(255,255,255,.1);

  pointer-events:none;
}

.rankTitle{
  color:#42ffd8;
  font-weight:bold;
  margin-bottom:8px;
}

.rankLine{
  display:flex;
  justify-content:space-between;

  font-size:12px;

  margin:5px 0;

  color:#c8d1dc;
}

#joystick{
  position:fixed;

  z-index:20;

  left:25px;
  bottom:25px;

  width:130px;
  height:130px;

  display:none;

  border-radius:50%;

  border:2px solid rgba(255,255,255,.12);

  background:rgba(255,255,255,.04);

  touch-action:none;
}

#stick{
  position:absolute;

  width:55px;
  height:55px;

  left:50%;
  top:50%;

  margin-left:-27.5px;
  margin-top:-27.5px;

  border-radius:50%;

  background:rgba(66,255,216,.7);

  box-shadow:
    0 0 25px rgba(66,255,216,.35);

  pointer-events:none;
}

#split{
  position:fixed;

  z-index:30;

  right:25px;
  bottom:30px;

  width:78px;
  height:78px;

  display:none;

  border-radius:50%;

  border:
    2px solid rgba(66,255,216,.35);

  background:
    rgba(66,255,216,.12);

  color:#42ffd8;

  font-size:12px;
  font-weight:bold;

  touch-action:none;

  user-select:none;
  -webkit-user-select:none;
}

#split:active{
  transform:scale(.92);

  background:
    rgba(66,255,216,.25);
}

#zoomInfo{
  position:fixed;

  z-index:5;

  left:50%;
  bottom:18px;

  transform:translateX(-50%);

  display:none;

  padding:7px 12px;

  border-radius:12px;

  background:rgba(5,10,16,.55);

  border:1px solid rgba(255,255,255,.08);

  color:#8e9bab;

  font-size:11px;

  pointer-events:none;
}

#message{
  position:fixed;

  z-index:50;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  display:none;

  width:min(360px,90vw);

  text-align:center;

  padding:25px;

  border-radius:20px;

  background:rgba(5,10,16,.94);

  border:
    1px solid rgba(66,255,216,.25);
}

#message h2{
  margin:0 0 8px;
  color:#42ffd8;
}

#message button{
  margin-top:15px;
  width:180px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

  <div class="panel">

    <div class="logo">
      AGARIO
    </div>

    <div class="subtitle">
      Cresça. Coma. Sobreviva.
    </div>

    <input
      id="name"
      maxlength="18"
      placeholder="Digite seu nome"
      value="Obsidian"
      autocomplete="off"
    >

    <button id="play">
      JOGAR
    </button>

  </div>

</div>

<div id="hud">

  <div class="hudBox">
    Massa:
    <b id="mass">35</b>
  </div>

  <div class="hudBox">
    Recorde:
    <b id="best">0</b>
  </div>

</div>

<div id="rank">

  <div class="rankTitle">
    RANKING
  </div>

  <div id="ranking"></div>

</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<button id="split">
  DIVIDIR
</button>

<div id="zoomInfo">
  🤏 Pinça para aumentar/diminuir a câmera
</div>

<div id="message">

  <h2>
    Você morreu!
  </h2>

  <div id="finalScore"></div>

  <button id="restart">
    JOGAR NOVAMENTE
  </button>

</div>

<script>
(function(){

"use strict";

/* =========================================================
   CANVAS
========================================================= */

var canvas =
  document.getElementById("game");

var ctx =
  canvas.getContext("2d");

var W=1;
var H=1;
var DPR=1;

function resize(){

  W=Math.max(
    1,
    window.innerWidth ||
    document.documentElement.clientWidth ||
    1
  );

  H=Math.max(
    1,
    window.innerHeight ||
    document.documentElement.clientHeight ||
    1
  );

  DPR=Math.min(
    window.devicePixelRatio || 1,
    2
  );

  canvas.width =
    Math.floor(W*DPR);

  canvas.height =
    Math.floor(H*DPR);

  canvas.style.width =
    W+"px";

  canvas.style.height =
    H+"px";

  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );
}

window.addEventListener(
  "resize",
  resize
);

window.addEventListener(
  "orientationchange",
  function(){

    setTimeout(
      resize,
      100
    );

  }
);

resize();


/* =========================================================
   ELEMENTOS
========================================================= */

var menu =
  document.getElementById("menu");

var play =
  document.getElementById("play");

var nameInput =
  document.getElementById("name");

var hud =
  document.getElementById("hud");

var massEl =
  document.getElementById("mass");

var bestEl =
  document.getElementById("best");

var rank =
  document.getElementById("rank");

var ranking =
  document.getElementById("ranking");

var joystick =
  document.getElementById("joystick");

var stick =
  document.getElementById("stick");

var splitBtn =
  document.getElementById("split");

var zoomInfo =
  document.getElementById("zoomInfo");

var message =
  document.getElementById("message");

var finalScore =
  document.getElementById("finalScore");

var restart =
  document.getElementById("restart");


/* =========================================================
   CONFIGURAÇÃO
========================================================= */

var INITIAL_FOOD=500;

var MAX_FOOD=450;

var BOT_COUNT=15;

var MERGE_TIME=3500;

var MERGE_DISTANCE_FACTOR=1.15;

var MERGE_PULL=.055;

var MERGE_ATTRACT_DISTANCE=700;

var MIN_SPLIT_RADIUS=32;

var SPLIT_COOLDOWN=220;


/* =========================================================
   ESTADO
========================================================= */

var food=[];

var bots=[];

var playerCells=[];

var playerName="Obsidian";

var running=false;

var gameOver=false;

var lastSplitTime=0;


/* =========================================================
   CÂMERA
========================================================= */

var cameraX=0;

var cameraY=0;

var cameraZoom=1;

var MIN_ZOOM=.45;

var MAX_ZOOM=2.2;


/* =========================================================
   JOYSTICK
========================================================= */

var joystickActive=false;

var joystickX=0;

var joystickY=0;


/*
 * Guarda qual dedo está usando
 * o joystick.
 */
var joystickPointerId=null;


/* =========================================================
   PINÇA
========================================================= */

var pinchActive=false;

var pinchStartDistance=0;

var pinchStartZoom=1;


/* =========================================================
   RECORDES
========================================================= */

var bestScore=
  Number(
    localStorage.getItem(
      "agario_best"
    ) || 0
  );

bestEl.textContent=
  bestScore;


/* =========================================================
   UTILIDADES
========================================================= */

function rand(min,max){

  return Math.random()*
    (max-min)+min;

}

function randint(min,max){

  return Math.floor(
    rand(min,max+1)
  );

}

function clamp(v,min,max){

  return Math.max(
    min,
    Math.min(max,v)
  );

}

function distance(a,b){

  var dx=
    a.x-b.x;

  var dy=
    a.y-b.y;

  return Math.sqrt(
    dx*dx+
    dy*dy
  );

}

function randomColor(){

  var colors=[
    "#42ffd8",
    "#4da6ff",
    "#ff4d8d",
    "#ffd84d",
    "#9b6cff",
    "#ff7043",
    "#4cff62",
    "#ffffff"
  ];

  return colors[
    randint(
      0,
      colors.length-1
    )
  ];

}


/* =========================================================
   COMIDA
========================================================= */

var foodColors=[
  "#42ffd8",
  "#ff4d8d",
  "#ffd84d",
  "#4da6ff",
  "#9b6cff",
  "#ff7043",
  "#4cff62"
];

function createFoodNear(
  centerX,
  centerY,
  radius
){

  var angle=
    Math.random()*
    Math.PI*2;

  var dist=
    Math.sqrt(
      Math.random()
    )*
    radius;

  return {

    x:
      centerX+
      Math.cos(angle)*
      dist,

    y:
      centerY+
      Math.sin(angle)*
      dist,

    r:
      rand(5,9),

    color:
      foodColors[
        randint(
          0,
          foodColors.length-1
        )
      ],

    pulse:
      rand(
        0,
        Math.PI*2
      )

  };

}

function createFoodPack(
  amount,
  centerX,
  centerY
){

  for(
    var i=0;
    i<amount;
    i++
  ){

    food.push(
      createFoodNear(
        centerX,
        centerY,
        1700
      )
    );

  }

}


/* =========================================================
   CÉLULA PLAYER
========================================================= */

function createPlayerCell(
  x,
  y,
  radius,
  name,
  color
){

  return {

    x:x,

    y:y,

    r:radius,

    mass:
      radius*
      radius/
      33,

    name:name,

    color:
      color ||
      "#42ffd8",

    born:
      performance.now(),

    canMerge:false,

    vx:0,

    vy:0,

    splitVelocity:0,

    splitDirectionX:0,

    splitDirectionY:0

  };

}


/* =========================================================
   BOT
========================================================= */

function createBotNear(
  centerX,
  centerY
){

  var radius=
    rand(22,70);

  var angle=
    Math.random()*
    Math.PI*2;

  var dist=
    rand(
      300,
      1800
    );

  return {

    x:
      centerX+
      Math.cos(angle)*
      dist,

    y:
      centerY+
      Math.sin(angle)*
      dist,

    r:radius,

    mass:
      radius*
      radius/
      33,

    color:
      randomColor(),

    name:[
      "Pixel",
      "Shadow",
      "Nexus",
      "Cyber",
      "Ghost",
      "Alpha",
      "Nova",
      "Bot"
    ][
      randint(0,7)
    ],

    vx:
      rand(-1,1),

    vy:
      rand(-1,1),

    change:
      randint(50,150),

    born:
      performance.now(),

    canMerge:false,

    splitCooldown:
      rand(
        3000,
        8000
      )

  };

}


/* =========================================================
   INICIAR
========================================================= */

function startGame(){

  playerName=
    nameInput.value
      .trim()
      .slice(0,18);

  if(!playerName){

    playerName="Obsidian";

  }

  playerCells=[
    createPlayerCell(
      0,
      0,
      35,
      playerName,
      "#42ffd8"
    )
  ];

  food=[];

  bots=[];

  createFoodPack(
    INITIAL_FOOD,
    0,
    0
  );

  for(
    var i=0;
    i<BOT_COUNT;
    i++
  ){

    bots.push(
      createBotNear(
        0,
        0
      )
    );

  }

  cameraX=0;

  cameraY=0;

  cameraZoom=1;

  lastSplitTime=0;

  running=true;

  gameOver=false;

  menu.style.display="none";

  message.style.display="none";

  hud.style.display="flex";

  rank.style.display="block";

  joystick.style.display="block";

  splitBtn.style.display="block";

  zoomInfo.style.display="block";

  setTimeout(
    function(){

      zoomInfo.style.display="none";

    },
    4500
  );

  resetJoystick();

  updateHUD();

}

play.addEventListener(
  "click",
  startGame
);

nameInput.addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){

      startGame();

    }

  }
);


/* =========================================================
   MOVIMENTO
========================================================= */

function getMovement(){

  if(!joystickActive){

    return {
      x:0,
      y:0
    };

  }

  return {

    x:joystickX,

    y:joystickY

  };

}


/* =========================================================
   VELOCIDADE
========================================================= */

function getCellSpeed(cell){

  var speed=
    5.2*
    Math.max(
      .35,
      45/cell.r
    );

  return clamp(
    speed,
    1.2,
    7
  );

}


/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(){

  var move=
    getMovement();

  for(
    var i=0;
    i<playerCells.length;
    i++
  ){

    var cell=
      playerCells[i];

    if(
      joystickActive
    ){

      var speed=
        getCellSpeed(
          cell
        );

      cell.x+=
        move.x*
        speed;

      cell.y+=
        move.y*
        speed;

    }

    if(
      performance.now()-
      cell.born>=
      MERGE_TIME
    ){

      cell.canMerge=true;

    }

  }

  if(
    playerCells.length
  ){

    var cx=0;

    var cy=0;

    for(
      var j=0;
      j<playerCells.length;
      j++
    ){

      cx+=
        playerCells[j].x;

      cy+=
        playerCells[j].y;

    }

    cx/=
      playerCells.length;

    cy/=
      playerCells.length;

    cameraX+=
      (cx-cameraX)*.08;

    cameraY+=
      (cy-cameraY)*.08;

  }

}


/* =========================================================
   BOTS
========================================================= */

function updateBots(){

  for(
    var i=0;
    i<bots.length;
    i++
  ){

    var bot=
      bots[i];

    bot.change--;

    if(
      bot.change<=0
    ){

      bot.vx=
        rand(-1,1);

      bot.vy=
        rand(-1,1);

      var len=
        Math.sqrt(
          bot.vx*
          bot.vx+
          bot.vy*
          bot.vy
        );

      if(len>0){

        bot.vx/=len;
        bot.vy/=len;

      }

      bot.change=
        randint(
          50,
          150
        );

    }

    var speed=
      clamp(
        4.2*
        Math.max(
          .4,
          40/bot.r
        ),
        1.2,
        5
      );

    bot.x+=
      bot.vx*
      speed;

    bot.y+=
      bot.vy*
      speed;

    bot.splitCooldown-=16.67;

    if(
      bot.splitCooldown<=0 &&
      bot.r>=MIN_SPLIT_RADIUS &&
      Math.random()<.002
    ){

      splitBot(bot);

      bot.splitCooldown=
        rand(
          5000,
          10000
        );

    }

  }

}


/* =========================================================
   SPLIT BOT
========================================================= */

function splitBot(bot){

  var newRadius=
    bot.r/
    Math.sqrt(2);

  if(
    newRadius<18
  ){

    return;

  }

  var angle=
    Math.random()*
    Math.PI*2;

  var distanceFromCenter=
    bot.r;

  var newBot={

    x:
      bot.x+
      Math.cos(angle)*
      distanceFromCenter,

    y:
      bot.y+
      Math.sin(angle)*
      distanceFromCenter,

    r:newRadius,

    mass:
      newRadius*
      newRadius/
      33,

    color:
      bot.color,

    name:
      bot.name,

    vx:
      Math.cos(angle),

    vy:
      Math.sin(angle),

    change:50,

    born:
      performance.now(),

    canMerge:false,

    splitCooldown:5000

  };

  bot.r=
    newRadius;

  bot.mass=
    newRadius*
    newRadius/
    33;

  bot.born=
    performance.now();

  bot.canMerge=false;

  bots.push(
    newBot
  );

}


/* =========================================================
   COMER COMIDA
========================================================= */

function eatFood(){

  for(
    var c=0;
    c<playerCells.length;
    c++
  ){

    var cell=
      playerCells[c];

    for(
      var i=food.length-1;
      i>=0;
      i--
    ){

      var f=
        food[i];

      if(
        distance(
          cell,
          f
        )<
        cell.r+f.r
      ){

        cell.mass+=1.5;

        cell.r=
          Math.sqrt(
            cell.mass*
            33
          );

        food.splice(
          i,
          1
        );

      }

    }

  }

}


/* =========================================================
   PLAYER X BOTS
========================================================= */

function playerBotCollision(){

  for(
    var p=
      playerCells.length-1;
    p>=0;
    p--
  ){

    var cell=
      playerCells[p];

    for(
      var b=
        bots.length-1;
      b>=0;
      b--
    ){

      var bot=
        bots[b];

      var d=
        distance(
          cell,
          bot
        );

      if(
        cell.r>
        bot.r*1.12 &&
        d<
        cell.r-bot.r*.20
      ){

        cell.mass+=
          bot.mass;

        cell.r=
          Math.sqrt(
            cell.mass*
            33
          );

        bots.splice(
          b,
          1
        );

        continue;

      }

      if(
        bot.r>
        cell.r*1.12 &&
        d<
        bot.r-cell.r*.20
      ){

        playerCells.splice(
          p,
          1
        );

        break;

      }

    }

  }

  if(
    playerCells.length===0
  ){

    die();

  }

}


/* =========================================================
   BOT X BOT
========================================================= */

function botBotCollision(){

  for(
    var a=
      bots.length-1;
    a>=0;
    a--
  ){

    var A=
      bots[a];

    for(
      var b=
        bots.length-1;
      b>=0;
      b--
    ){

      if(a===b){

        continue;

      }

      var B=
        bots[b];

      var d=
        distance(
          A,
          B
        );

      if(
        A.r>
        B.r*1.15 &&
        d<
        A.r-B.r*.15
      ){

        A.mass+=
          B.mass;

        A.r=
          Math.sqrt(
            A.mass*
            33
          );

        bots.splice(
          b,
          1
        );

        break;

      }

    }

  }

}


/* =========================================================
   DIVIDIR PLAYER
========================================================= */

function splitPlayer(){

  if(
    !running ||
    gameOver
  ){

    return;

  }

  var now=
    performance.now();

  if(
    now-lastSplitTime<
    SPLIT_COOLDOWN
  ){

    return;

  }

  lastSplitTime=
    now;

  /*
   * Direção do joystick.
   *
   * Se estiver andando,
   * a divisão vai exatamente
   * para frente.
   */

  var directionX=0;

  var directionY=0;

  if(
    joystickActive &&
    (
      Math.abs(joystickX)>.05 ||
      Math.abs(joystickY)>.05
    )
  ){

    directionX=
      joystickX;

    directionY=
      joystickY;

  }else{

    /*
     * Se estiver parado,
     * usa a direção padrão.
     */

    directionX=1;

    directionY=0;

  }


  var directionLength=
    Math.sqrt(
      directionX*
      directionX+
      directionY*
      directionY
    );

  if(
    directionLength>0
  ){

    directionX /=
      directionLength;

    directionY /=
      directionLength;

  }


  /*
   * Copia as células existentes.
   *
   * Isso permite dividir várias
   * vezes conforme a massa permite.
   */

  var originals=
    playerCells.slice();

  for(
    var i=0;
    i<originals.length;
    i++
  ){

    var cell=
      originals[i];

    if(
      cell.r<
      MIN_SPLIT_RADIUS
    ){

      continue;

    }

    /*
     * Divide a massa igualmente.
     */

    var newRadius=
      cell.r/
      Math.sqrt(2);

    /*
     * A nova célula nasce à frente.
     */

    var pushDistance=
      cell.r*1.35;

    var newCell=
      createPlayerCell(

        cell.x+
        directionX*
        pushDistance,

        cell.y+
        directionY*
        pushDistance,

        newRadius,

        cell.name,

        cell.color

      );

    /*
     * Guarda a direção do disparo.
     */

    newCell.splitDirectionX=
      directionX;

    newCell.splitDirectionY=
      directionY;

    /*
     * Impulso MUITO mais forte.
     */

    newCell.splitVelocity=
      32;

    /*
     * As duas ficam protegidas
     * contra fusão durante o tempo
     * definido.
     */

    cell.r=
      newRadius;

    cell.mass=
      newRadius*
      newRadius/
      33;

    cell.born=
      now;

    cell.canMerge=false;

    newCell.born=
      now;

    newCell.canMerge=false;

    /*
     * A célula lançada entra
     * imediatamente na lista.
     */

    playerCells.push(
      newCell
    );

  }

}


/* =========================================================
   IMPULSO DA DIVISÃO
========================================================= */

function updateSplitVelocity(){

  for(
    var i=0;
    i<playerCells.length;
    i++
  ){

    var cell=
      playerCells[i];

    if(
      cell.splitVelocity>0
    ){

      /*
       * Usa a direção salva no momento
       * da divisão.
       */

      var dx=
        cell.splitDirectionX;

      var dy=
        cell.splitDirectionY;

      cell.x+=
        dx*
        cell.splitVelocity;

      cell.y+=
        dy*
        cell.splitVelocity;

      /*
       * Desaceleração progressiva.
       */

      cell.splitVelocity*=.88;

      if(
        cell.splitVelocity<.2
      ){

        cell.splitVelocity=0;

      }

    }

  }

}


/* =========================================================
   FUSÃO AUTOMÁTICA
========================================================= */

function mergePlayerCells(){

  if(
    playerCells.length<2
  ){

    return;

  }

  var now=
    performance.now();

  /*
   * Libera as células após
   * o tempo de segurança.
   */

  for(
    var i=0;
    i<playerCells.length;
    i++
  ){

    var cell=
      playerCells[i];

    if(
      !cell.canMerge &&
      now-cell.born>=
      MERGE_TIME
    ){

      cell.canMerge=true;

    }

  }


  /*
   * Várias passagens para permitir
   * fusões em sequência.
   */

  for(
    var pass=0;
    pass<3;
    pass++
  ){

    for(
      var a=0;
      a<playerCells.length;
      a++
    ){

      var A=
        playerCells[a];

      if(
        !A.canMerge
      ){

        continue;

      }

      for(
        var b=a+1;
        b<playerCells.length;
        b++
      ){

        var B=
          playerCells[b];

        if(
          !B.canMerge
        ){

          continue;

        }

        var dx=
          B.x-A.x;

        var dy=
          B.y-A.y;

        var d=
          Math.sqrt(
            dx*dx+
            dy*dy
          );

        /*
         * Atração.
         */

        if(
          d>
          Math.max(
            A.r,
            B.r
          )*
          MERGE_DISTANCE_FACTOR &&
          d<
          MERGE_ATTRACT_DISTANCE
        ){

          if(d>0){

            var nx=
              dx/d;

            var ny=
              dy/d;

            var pullA=
              MERGE_PULL*
              Math.max(
                .45,
                45/A.r
              );

            var pullB=
              MERGE_PULL*
              Math.max(
                .45,
                45/B.r
              );

            A.x+=
              nx*
              pullA*
              10;

            A.y+=
              ny*
              pullA*
              10;

            B.x-=
              nx*
              pullB*
              10;

            B.y-=
              ny*
              pullB*
              10;

          }

        }

        /*
         * Fusao.
         */

        var mergeDistance=
          Math.max(
            A.r,
            B.r
          )*
          MERGE_DISTANCE_FACTOR;

        if(
          d<=
          mergeDistance
        ){

          var main=A;

          var other=B;

          if(
            B.mass>A.mass
          ){

            main=B;

            other=A;

          }

          main.mass=
            A.mass+
            B.mass;

          main.r=
            Math.sqrt(
              main.mass*
              33
            );

          main.name=
            playerName;

          main.x=
            (
              A.x+
              B.x
            )/2;

          main.y=
            (
              A.y+
              B.y
            )/2;

          main.canMerge=true;

          main.born=
            now-MERGE_TIME;

          var removeIndex=
            playerCells.indexOf(
              other
            );

          if(
            removeIndex!==-1
          ){

            playerCells.splice(
              removeIndex,
              1
            );

          }

          break;

        }

      }

    }

  }

}


/* =========================================================
   COMIDA INFINITA
========================================================= */

function maintainFood(){

  if(
    playerCells.length===0
  ){

    return;

  }

  while(
    food.length<MAX_FOOD
  ){

    food.push(
      createFoodNear(
        cameraX,
        cameraY,
        2200
      )
    );

  }

  for(
    var i=food.length-1;
    i>=0;
    i--
  ){

    var dx=
      food[i].x-cameraX;

    var dy=
      food[i].y-cameraY;

    if(
      Math.abs(dx)>5000 ||
      Math.abs(dy)>5000
    ){

      food.splice(
        i,
        1
      );

    }

  }

}


/* =========================================================
   BOTS INFINITOS
========================================================= */

function maintainBots(){

  while(
    bots.length<BOT_COUNT
  ){

    bots.push(
      createBotNear(
        cameraX,
        cameraY
      )
    );

  }

  for(
    var i=0;
    i<bots.length;
    i++
  ){

    var bot=
      bots[i];

    var dx=
      bot.x-cameraX;

    var dy=
      bot.y-cameraY;

    if(
      Math.abs(dx)>6000 ||
      Math.abs(dy)>6000
    ){

      var angle=
        Math.random()*
        Math.PI*2;

      var d=
        rand(
          1800,
          3000
        );

      bot.x=
        cameraX+
        Math.cos(angle)*d;

      bot.y=
        cameraY+
        Math.sin(angle)*d;

    }

  }

}


/* =========================================================
   WORLD -> SCREEN
========================================================= */

function worldToScreen(
  x,
  y
){

  return {

    x:
      (x-cameraX)*
      cameraZoom+
      W/2,

    y:
      (y-cameraY)*
      cameraZoom+
      H/2

  };

}


/* =========================================================
   FUNDO
========================================================= */

function drawBackground(){

  ctx.fillStyle=
    "#080b12";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  var baseGrid=80;

  var grid=
    baseGrid*
    cameraZoom;

  if(grid<25){

    grid=25;

  }

  if(grid>180){

    grid=180;

  }

  var offsetX=
    (
      W/2-
      cameraX*
      cameraZoom
    )%grid;

  var offsetY=
    (
      H/2-
      cameraY*
      cameraZoom
    )%grid;

  ctx.strokeStyle=
    "rgba(255,255,255,.045)";

  ctx.lineWidth=1;

  for(
    var x=offsetX;
    x<W;
    x+=grid
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      0
    );

    ctx.lineTo(
      x,
      H
    );

    ctx.stroke();

  }

  for(
    var y=offsetY;
    y<H;
    y+=grid
  ){

    ctx.beginPath();

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      W,
      y
    );

    ctx.stroke();

  }

}


/* =========================================================
   COMIDA
========================================================= */

function drawFood(){

  for(
    var i=0;
    i<food.length;
    i++
  ){

    var f=
      food[i];

    var p=
      worldToScreen(
        f.x,
        f.y
      );

    var radius=
      f.r*
      cameraZoom;

    if(
      p.x<-30 ||
      p.x>W+30 ||
      p.y<-30 ||
      p.y>H+30
    ){

      continue;

    }

    var pulse=
      Math.sin(
        performance.now()*.004+
        f.pulse
      )*.8;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      radius+
      pulse*cameraZoom,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      f.color;

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
      p.x-radius*.3,
      p.y-radius*.35,
      radius*.25,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      "rgba(255,255,255,.7)";

    ctx.fill();

  }

}


/* =========================================================
   CÉLULA
========================================================= */

function drawCell(cell){

  var p=
    worldToScreen(
      cell.x,
      cell.y
    );

  var radius=
    cell.r*
    cameraZoom;

  if(
    p.x<-radius ||
    p.x>W+radius ||
    p.y<-radius ||
    p.y>H+radius
  ){

    return;

  }

  ctx.save();

  ctx.shadowBlur=
    22*
    cameraZoom;

  ctx.shadowColor=
    cell.color;

  var gradient=
    ctx.createRadialGradient(

      p.x-radius*.35,
      p.y-radius*.35,
      2,

      p.x,
      p.y,
      radius

    );

  gradient.addColorStop(
    0,
    "#ffffff"
  );

  gradient.addColorStop(
    .18,
    cell.color
  );

  gradient.addColorStop(
    1,
    cell.color
  );

  ctx.beginPath();

  ctx.arc(
    p.x,
    p.y,
    radius,
    0,
    Math.PI*2
  );

  ctx.fillStyle=
    gradient;

  ctx.fill();

  ctx.shadowBlur=0;

  ctx.strokeStyle=
    "rgba(255,255,255,.3)";

  ctx.lineWidth=
    Math.max(
      1,
      2*cameraZoom
    );

  ctx.stroke();

  ctx.beginPath();

  ctx.arc(
    p.x-radius*.30,
    p.y-radius*.32,
    radius*.20,
    0,
    Math.PI*2
  );

  ctx.fillStyle=
    "rgba(255,255,255,.75)";

  ctx.fill();

  ctx.fillStyle=
    "#ffffff";

  ctx.font=
    "bold "+
    Math.max(
      10,
      radius*.34
    )+
    "px Arial";

  ctx.textAlign=
    "center";

  ctx.textBaseline=
    "middle";

  ctx.shadowColor=
    "rgba(0,0,0,.8)";

  ctx.shadowBlur=4;

  ctx.fillText(
    cell.name,
    p.x,
    p.y
  );

  ctx.restore();

}


/* =========================================================
   DESENHAR
========================================================= */

function drawBots(){

  for(
    var i=0;
    i<bots.length;
    i++
  ){

    drawCell(
      bots[i]
    );

  }

}

function drawPlayer(){

  for(
    var i=0;
    i<playerCells.length;
    i++
  ){

    drawCell(
      playerCells[i]
    );

  }

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  if(
    !playerCells.length
  ){

    return;

  }

  var totalMass=0;

  for(
    var i=0;
    i<playerCells.length;
    i++
  ){

    totalMass+=
      playerCells[i].mass;

  }

  var mass=
    Math.floor(
      totalMass
    );

  massEl.textContent=
    mass;

  if(
    mass>bestScore
  ){

    bestScore=mass;

    localStorage.setItem(
      "agario_best",
      String(bestScore)
    );

  }

  bestEl.textContent=
    bestScore;

  var list=[];

  for(
    var b=0;
    b<bots.length;
    b++
  ){

    list.push({

      name:
        bots[b].name,

      mass:
        Math.floor(
          bots[b].mass
        )

    });

  }

  list.push({

    name:
      playerName,

    mass:
      mass

  });

  list.sort(
    function(a,b){

      return b.mass-a.mass;

    }
  );

  list=
    list.slice(
      0,
      7
    );

  var html="";

  for(
    var r=0;
    r<list.length;
    r++
  ){

    html+=
      '<div class="rankLine">'+
      '<span>'+
      (r+1)+
      ". "+
      list[r].name+
      "</span>"+
      "<span>"+
      list[r].mass+
      "</span>"+
      "</div>";

  }

  ranking.innerHTML=
    html;

}


/* =========================================================
   JOYSTICK — POINTER EVENTS
========================================================= */

function joystickMove(
  clientX,
  clientY
){

  var rect=
    joystick.getBoundingClientRect();

  var cx=
    rect.left+
    rect.width/2;

  var cy=
    rect.top+
    rect.height/2;

  var dx=
    clientX-cx;

  var dy=
    clientY-cy;

  var max=45;

  var len=
    Math.sqrt(
      dx*dx+
      dy*dy
    );

  if(
    len>max
  ){

    dx=
      dx/len*max;

    dy=
      dy/len*max;

  }

  joystickX=
    dx/max;

  joystickY=
    dy/max;

  if(
    Math.abs(joystickX)<.08 &&
    Math.abs(joystickY)<.08
  ){

    joystickX=0;
    joystickY=0;

  }

  stick.style.transform=
    "translate("+
    dx+
    "px,"+
    dy+
    "px)";

}


function resetJoystick(){

  joystickActive=false;

  joystickPointerId=null;

  joystickX=0;

  joystickY=0;

  stick.style.transform=
    "translate(0,0)";

}


/*
 * pointerdown do joystick.
 */

joystick.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();

    e.stopPropagation();

    joystickActive=true;

    joystickPointerId=
      e.pointerId;

    try{

      joystick.setPointerCapture(
        e.pointerId
      );

    }catch(_){}

    joystickMove(
      e.clientX,
      e.clientY
    );

  },
  {
    passive:false
  }
);


/*
 * Movimento do dedo do joystick.
 */

joystick.addEventListener(
  "pointermove",
  function(e){

    if(
      !joystickActive ||
      e.pointerId!==
      joystickPointerId
    ){

      return;

    }

    e.preventDefault();

    joystickMove(
      e.clientX,
      e.clientY
    );

  },
  {
    passive:false
  }
);


/*
 * Soltou o joystick.
 */

function joystickRelease(e){

  if(
    joystickPointerId!==null &&
    e.pointerId!==
    joystickPointerId
  ){

    return;

  }

  e.preventDefault();

  resetJoystick();

}

joystick.addEventListener(
  "pointerup",
  joystickRelease,
  {
    passive:false
  }
);

joystick.addEventListener(
  "pointercancel",
  joystickRelease,
  {
    passive:false
  }
);

joystick.addEventListener(
  "lostpointercapture",
  function(){

    resetJoystick();

  }
);


/* =========================================================
   PINÇA — TOUCH DIRETO NO CANVAS
========================================================= */

function getTouchDistance(
  touches
){

  if(
    touches.length<2
  ){

    return 0;

  }

  var dx=
    touches[0].clientX-
    touches[1].clientX;

  var dy=
    touches[0].clientY-
    touches[1].clientY;

  return Math.sqrt(
    dx*dx+
    dy*dy
  );

}

canvas.addEventListener(
  "touchstart",
  function(e){

    if(
      e.touches.length===2
    ){

      e.preventDefault();

      pinchActive=true;

      pinchStartDistance=
        getTouchDistance(
          e.touches
        );

      pinchStartZoom=
        cameraZoom;

    }

  },
  {
    passive:false
  }
);

canvas.addEventListener(
  "touchmove",
  function(e){

    if(
      e.touches.length===2 &&
      pinchActive
    ){

      e.preventDefault();

      var currentDistance=
        getTouchDistance(
          e.touches
        );

      if(
        pinchStartDistance<=0
      ){

        return;

      }

      var factor=
        currentDistance/
        pinchStartDistance;

      cameraZoom=
        clamp(
          pinchStartZoom*
          factor,
          MIN_ZOOM,
          MAX_ZOOM
        );

    }

  },
  {
    passive:false
  }
);

canvas.addEventListener(
  "touchend",
  function(e){

    if(
      e.touches.length<2
    ){

      pinchActive=false;

    }

  },
  {
    passive:false
  }
);

canvas.addEventListener(
  "touchcancel",
  function(){

    pinchActive=false;

  }
);


/* =========================================================
   ZOOM MOUSE
========================================================= */

canvas.addEventListener(
  "wheel",
  function(e){

    e.preventDefault();

    if(
      e.deltaY<0
    ){

      cameraZoom+=.08;

    }else{

      cameraZoom-=.08;

    }

    cameraZoom=
      clamp(
        cameraZoom,
        MIN_ZOOM,
        MAX_ZOOM
      );

  },
  {
    passive:false
  }
);


/* =========================================================
   BOTÃO DIVIDIR — MULTI-TOUCH
========================================================= */

/*
 * IMPORTANTE:
 *
 * pointerdown dispara imediatamente.
 *
 * Portanto:
 *
 * DEDO 1 = joystick
 * DEDO 2 = dividir
 *
 * podem funcionar ao mesmo tempo.
 */

function dividirComToque(e){

  e.preventDefault();

  e.stopPropagation();

  splitPlayer();

}

splitBtn.addEventListener(
  "pointerdown",
  dividirComToque,
  {
    passive:false
  }
);


/*
 * Bloqueia o touchstart nativo
 * para não gerar outro evento
 * depois do pointerdown.
 */

splitBtn.addEventListener(
  "touchstart",
  function(e){

    e.preventDefault();

    e.stopPropagation();

  },
  {
    passive:false
  }
);


/* =========================================================
   TECLADO
========================================================= */

window.addEventListener(
  "keydown",
  function(e){

    if(
      e.code==="Space"
    ){

      e.preventDefault();

      splitPlayer();

    }

  }
);


/* =========================================================
   MORTE
========================================================= */

function die(){

  if(
    gameOver
  ){

    return;

  }

  gameOver=true;

  running=false;

  resetJoystick();

  var score=0;

  for(
    var i=0;
    i<playerCells.length;
    i++
  ){

    score+=
      playerCells[i].mass;

  }

  score=
    Math.floor(
      score
    );

  if(
    score>bestScore
  ){

    bestScore=
      score;

    localStorage.setItem(
      "agario_best",
      String(bestScore)
    );

  }

  finalScore.textContent=
    "Pontuação: "+
    score+
    " • Recorde: "+
    bestScore;

  message.style.display=
    "block";

  joystick.style.display=
    "none";

  splitBtn.style.display=
    "none";

  zoomInfo.style.display=
    "none";

}


/* =========================================================
   REINICIAR
========================================================= */

restart.addEventListener(
  "click",
  startGame
);


/* =========================================================
   UPDATE
========================================================= */

function update(){

  if(
    !running ||
    gameOver
  ){

    return;

  }

  updatePlayer();

  updateSplitVelocity();

  updateBots();

  eatFood();

  playerBotCollision();

  botBotCollision();

  mergePlayerCells();

  maintainFood();

  maintainBots();

  updateHUD();

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  drawBackground();

  drawFood();

  drawBots();

  drawPlayer();

}


/* =========================================================
   LOOP
========================================================= */

function frame(){

  update();

  render();

  requestAnimationFrame(
    frame
  );

}

requestAnimationFrame(
  frame
);


/* =========================================================
   PRIMEIRO DESENHO
========================================================= */

drawBackground();

})();
</script>
