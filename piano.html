<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<title>🎹 Obsidian Piano</title>

<style>

html{
  background:#07070d!important;
  min-height:100%;
}

body{
  min-height:100vh;
}


/* =====================================================
   BASE
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;

  background:#080a0f;
  color:#fff;

  font-family:Arial,sans-serif;
}

body{
  display:flex;
}


/* =====================================================
   APP
===================================================== */

.app{
  width:100%;
  height:100%;

  display:flex;
  flex-direction:column;

  overflow:hidden;

  background:
    radial-gradient(
      circle at top,
      #171d2a,
      #080a0f 65%
    );
}


/* =====================================================
   TOPO
===================================================== */

.topbar{
  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:8px;

  padding:8px 10px;

  border-bottom:
    1px solid
    #242a35;
}

.title{
  font-size:18px;
  font-weight:900;
}

.note{
  margin-top:3px;

  color:#8c97a9;

  font-size:12px;
}


/* =====================================================
   BOTÕES
===================================================== */

.controls{
  display:flex;
  gap:5px;
}

button{
  border:
    1px solid
    #303744;

  background:#171c25;

  color:#fff;

  border-radius:9px;

  min-height:38px;

  padding:7px 10px;

  font-weight:800;
  font-size:12px;

  cursor:pointer;

  outline:none;

  touch-action:manipulation;
}

button:active{
  transform:scale(.96);
}


/* =====================================================
   CONTROLES DE OITAVA
===================================================== */

.control-bars{
  flex-shrink:0;

  display:flex;
  flex-direction:column;

  gap:4px;

  padding:4px 6px;

  border-bottom:
    1px solid
    #202631;
}

.control-row{
  display:flex;

  align-items:center;
  justify-content:center;

  gap:8px;
}

.control-row button{
  width:42px;
  min-width:42px;

  min-height:34px;

  padding:4px 8px;

  font-size:17px;

  touch-action:manipulation;
}

.control-label{
  min-width:120px;

  text-align:center;

  color:#aeb6c4;

  font-size:12px;

  pointer-events:none;
}

.control-label strong{
  color:#fff;
}


/* =====================================================
   ORIENTAÇÃO
===================================================== */

.orientation{
  flex-shrink:0;

  display:flex;

  justify-content:center;

  gap:6px;

  padding:4px;
}

.orientation button{
  min-width:105px;
  min-height:34px;
}

.orientation button.active{
  background:#2c3b51;

  border-color:
    #557095;
}


/* =====================================================
   ÁREA DO PIANO
===================================================== */

.piano-area{
  flex:1;

  min-height:0;

  width:100%;

  display:flex;

  align-items:center;
  justify-content:center;

  overflow:hidden;

  padding:5px 0;
}


/* =====================================================
   VIEWPORT
===================================================== */

.piano-viewport{
  position:relative;

  width:100%;
  height:100%;

  display:flex;

  align-items:center;
  justify-content:center;

  overflow:hidden;

  touch-action:none;
}


/* =====================================================
   PIANO
===================================================== */

.piano{
  position:relative;

  width:100%;

  /*
   * Um pouco maior que o original.
   */

  height:82%;

  min-height:190px;

  max-height:560px;

  display:flex;

  align-items:stretch;
  justify-content:center;

  touch-action:none;

  transition:
    width .15s ease,
    height .15s ease;
}


/*
 * Quando estiver deitado:
 * ocupa praticamente toda a altura disponível.
 */

body.horizontal .piano{

  width:100%;

  height:94%;

  max-height:none;

}


/* =====================================================
   TECLADO
===================================================== */

.keyboard{
  position:relative;

  width:100%;
  height:100%;

  display:flex;

  overflow:visible;

  touch-action:none;

  will-change:
    transform;
}


/* =====================================================
   OITAVA
===================================================== */

.octave{
  position:relative;

  height:100%;

  flex:
    0 0 auto;

  display:flex;

  touch-action:none;
}


/* =====================================================
   TECLAS BRANCAS
===================================================== */

.white-keys{
  position:absolute;

  inset:0;

  display:flex;

  width:100%;
  height:100%;
}

.white-key{
  position:relative;

  flex:
    1 1 0;

  min-width:0;

  height:100%;

  padding:
    0
    0
    13px;

  border:
    1px solid
    #777d87;

  border-radius:
    0
    0
    9px
    9px;

  background:
    linear-gradient(
      to bottom,
      #fff 0%,
      #f0f1f3 72%,
      #c9ccd2 100%
    );

  color:#222831;

  display:flex;

  align-items:flex-end;
  justify-content:center;

  font-size:11px;

  font-weight:900;

  touch-action:none;

  outline:none;

  z-index:1;
}

.white-key.active{
  background:
    linear-gradient(
      to bottom,
      #d9edff,
      #8dc3ff 70%,
      #5d96d6
    );

  box-shadow:
    inset
    0 -12px
    22px
    rgba(40,120,220,.35),

    0
    0
    14px
    rgba(60,145,255,.25);
}


/* =====================================================
   TECLAS PRETAS
===================================================== */

.black-keys{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  pointer-events:none;

  z-index:5;
}

.black-key{
  position:absolute;

  top:0;

  width:11.5%;

  height:57%;

  transform:
    translateX(-50%);

  border:
    1px solid
    #000;

  border-radius:
    0
    0
    7px
    7px;

  background:
    linear-gradient(
      90deg,
      #030405,
      #292d35 45%,
      #030405
    );

  box-shadow:
    0
    7px
    10px
    rgba(0,0,0,.7);

  pointer-events:auto;

  touch-action:none;

  z-index:10;
}

.black-key.active{
  background:
    linear-gradient(
      90deg,
      #123d69,
      #4d9df0,
      #123d69
    );

  box-shadow:
    0
    0
    17px
    rgba(70,155,255,.7);
}


/* =====================================================
   NAVEGAÇÃO
===================================================== */

.navigation{
  position:absolute;

  left:0;
  right:0;

  top:50%;

  transform:
    translateY(-50%);

  display:flex;

  justify-content:space-between;

  padding:0 6px;

  pointer-events:none;

  z-index:30;
}

.nav-button{
  pointer-events:auto;

  width:38px;
  height:52px;

  min-width:38px;
  min-height:52px;

  padding:0;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:12px;

  background:
    rgba(15,19,27,.82);

  border:
    1px solid
    #394352;

  font-size:24px;

  opacity:.8;

  touch-action:manipulation;
}

.nav-button:disabled{
  opacity:.22;
}


/* =====================================================
   STATUS
===================================================== */

.status{
  flex-shrink:0;

  text-align:center;

  color:#778295;

  font-size:11px;

  padding:4px;
}


/* =====================================================
   AJUDA
===================================================== */

.help{
  flex-shrink:0;

  text-align:center;

  color:#535e70;

  font-size:10px;

  padding-bottom:5px;
}


/* =====================================================
   CELULAR
===================================================== */

@media(max-width:600px){

  .topbar{
    padding:6px 7px;
  }

  .title{
    font-size:16px;
  }

  .note{
    font-size:10px;
  }

  .controls button{
    min-height:34px;

    padding:5px 7px;

    font-size:10px;
  }

  .control-row button{
    width:38px;
    min-width:38px;

    min-height:32px;
  }

  .control-label{
    min-width:105px;
  }

  .orientation{
    padding:3px;
  }

  .orientation button{
    min-width:100px;
    min-height:32px;
  }

  .piano-area{
    padding:3px 0;
  }

  .white-key{
    padding-bottom:10px;
  }

}


/* =====================================================
   TELAS BAIXAS
===================================================== */

@media(max-height:600px){

  .topbar{
    padding:4px 7px;
  }

  .control-bars{
    padding:2px 5px;
  }

  .orientation{
    padding:2px;
  }

  .orientation button{
    min-height:29px;
  }

  .status,
  .help{
    display:none;
  }

  .piano{
    height:88% !important;
  }

  body.horizontal .piano{
    height:96% !important;
  }

}


/* =====================================================
   TELAS MUITO BAIXAS
===================================================== */

@media(max-height:430px){

  .topbar{
    padding:3px 6px;
  }

  .title{
    font-size:14px;
  }

  .note{
    display:none;
  }

  .control-bars{
    padding:1px 4px;
  }

  .orientation{
    padding:1px;
  }

  .orientation button{
    min-height:26px;
  }

  .piano{
    height:91% !important;
  }

  body.horizontal .piano{
    height:98% !important;
  }

}

</style>


<div class="app">

<script>

(() => {

"use strict";


/* =====================================================
   ELEMENTOS
===================================================== */

const piano =
  document.getElementById(
    "piano"
  );

const keyboard =
  document.getElementById(
    "keyboard"
  );

const pianoViewport =
  document.getElementById(
    "pianoViewport"
  );

const noteDisplay =
  document.getElementById(
    "noteDisplay"
  );

const status =
  document.getElementById(
    "status"
  );

const octaveValue =
  document.getElementById(
    "octaveValue"
  );

const viewValue =
  document.getElementById(
    "viewValue"
  );

const rotateBtn =
  document.getElementById(
    "rotateBtn"
  );

const invertBtn =
  document.getElementById(
    "invertBtn"
  );

const verticalBtn =
  document.getElementById(
    "verticalBtn"
  );

const horizontalBtn =
  document.getElementById(
    "horizontalBtn"
  );

const viewDown =
  document.getElementById(
    "viewDown"
  );

const viewUp =
  document.getElementById(
    "viewUp"
  );

const octaveDown =
  document.getElementById(
    "octaveDown"
  );

const octaveUp =
  document.getElementById(
    "octaveUp"
  );

const navLeft =
  document.getElementById(
    "navLeft"
  );

const navRight =
  document.getElementById(
    "navRight"
  );


/* =====================================================
   CONFIGURAÇÃO
===================================================== */

let octave =
  4;

let orientation =
  "vertical";

let inverted =
  false;

let visibleOctaves =
  1;

let viewOffset =
  0;


const MIN_VISIBLE =
  1;

const MAX_VISIBLE =
  8;


const whiteNotes = [

  "C",
  "D",
  "E",
  "F",
  "G",
  "A",
  "B"

];


const computerKeys = [

  "a",
  "w",
  "s",
  "e",
  "d",
  "f",
  "t",
  "g"

];


/* =====================================================
   ÁUDIO
===================================================== */

let audioContext =
  null;

let masterGain =
  null;

const activeVoices =
  new Set();

const pressed =
  new Map();


/* =====================================================
   FREQUÊNCIA
===================================================== */

function getFrequency(
  note,
  noteOctave
){

  const semitones = {

    C:0,
    "C#":1,

    D:2,
    "D#":3,

    E:4,

    F:5,
    "F#":6,

    G:7,
    "G#":8,

    A:9,
    "A#":10,

    B:11

  };


  const midi =
    (noteOctave + 1) *
    12 +
    semitones[note];


  return 440 *
    Math.pow(
      2,
      (midi - 69) / 12
    );

}


/* =====================================================
   INICIALIZAR ÁUDIO
===================================================== */

function initAudio(){

  try{

    if(!audioContext){

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


      if(!AudioContext){

        status.textContent =
          "❌ Este navegador não suporta áudio.";

        return false;

      }


      audioContext =
        new AudioContext();


      masterGain =
        audioContext.createGain();


      masterGain.gain.value =
        .75;


      masterGain.connect(
        audioContext.destination
      );

    }


    if(
      audioContext.state !==
      "running"
    ){

      audioContext.resume();

    }


    return true;

  }catch(error){

    console.error(
      "[AUDIO]",
      error
    );


    status.textContent =
      "❌ Erro ao iniciar o áudio.";


    return false;

  }

}


/* =====================================================
   DESBLOQUEAR ÁUDIO
===================================================== */

function unlockAudio(){

  if(!initAudio()){

    return;

  }


  if(
    audioContext.state ===
    "suspended"
  ){

    audioContext.resume();

  }

}


document.addEventListener(
  "pointerdown",
  unlockAudio,
  {
    passive:true
  }
);


/* =====================================================
   ENVELOPE
===================================================== */

function envelope(
  gain,
  now,
  attack,
  peak,
  release
){

  gain.gain.cancelScheduledValues(
    now
  );


  gain.gain.setValueAtTime(
    .0001,
    now
  );


  gain.gain.exponentialRampToValueAtTime(
    Math.max(
      .0001,
      peak
    ),
    now + attack
  );


  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now + release
  );

}


/* =====================================================
   FILTRO
===================================================== */

function createFilter(
  type,
  frequency,
  Q = 1
){

  const filter =
    audioContext.createBiquadFilter();


  filter.type =
    type;

  filter.frequency.value =
    frequency;

  filter.Q.value =
    Q;


  return filter;

}


/* =====================================================
   SAÍDA
===================================================== */

function connectOutput(
  output
){

  output.connect(
    masterGain
  );

}


/* =====================================================
   VOZ DO PIANO
===================================================== */

function createPianoVoice(
  frequency,
  now
){

  const output =
    audioContext.createGain();


  const filter =
    createFilter(
      "lowpass",
      4200,
      .7
    );


  const osc1 =
    audioContext.createOscillator();

  const osc2 =
    audioContext.createOscillator();


  const gain1 =
    audioContext.createGain();

  const gain2 =
    audioContext.createGain();


  osc1.type =
    "triangle";

  osc2.type =
    "sine";


  osc1.frequency.value =
    frequency;

  osc2.frequency.value =
    frequency * 2;


  gain1.gain.value =
    .42;

  gain2.gain.value =
    .12;


  osc1.connect(
    gain1
  );

  osc2.connect(
    gain2
  );


  gain1.connect(
    filter
  );

  gain2.connect(
    filter
  );


  filter.connect(
    output
  );


  connectOutput(
    output
  );


  envelope(
    output,
    now,
    .008,
    .55,
    2.2
  );


  osc1.start(
    now
  );

  osc2.start(
    now
  );


  osc1.stop(
    now + 2.25
  );

  osc2.stop(
    now + 2.25
  );


  return {

    output,

    oscillators:[
      osc1,
      osc2
    ]

  };

}


/* =====================================================
   CRIAR VOZ
===================================================== */

function createVoice(
  note,
  noteOctave
){

  if(!initAudio()){

    return null;

  }


  const frequency =
    getFrequency(
      note,
      noteOctave
    );


  const now =
    audioContext.currentTime;


  return createPianoVoice(
    frequency,
    now
  );

}


/* =====================================================
   TOCAR
===================================================== */

function playNote(
  note,
  noteOctave,
  element
){

  if(!initAudio()){

    return;

  }


  if(element._osc){

    return;

  }


  const voice =
    createVoice(
      note,
      noteOctave
    );


  if(!voice){

    return;

  }


  element._osc =
    voice;


  element._gain =
    voice.output;


  element._pressed =
    true;


  activeVoices.add(
    element
  );


  element.classList.add(
    "active"
  );


  noteDisplay.textContent =
    note +
    noteOctave;


  status.textContent =
    "🎹 Piano — " +
    note +
    noteOctave;

}


/* =====================================================
   PARAR
===================================================== */

function stopNote(
  element
){

  if(
    !element ||
    !element._osc ||
    !audioContext
  ){

    return;

  }


  const now =
    audioContext.currentTime;


  const voice =
    element._osc;


  const gain =
    element._gain;


  try{

    if(gain){

      gain.gain.cancelScheduledValues(
        now
      );


      gain.gain.setValueAtTime(
        Math.max(
          .0001,
          gain.gain.value
        ),
        now
      );


      gain.gain.exponentialRampToValueAtTime(
        .0001,
        now + .12
      );

    }


    if(
      voice.oscillators
    ){

      for(
        const oscillator
        of voice.oscillators
      ){

        try{

          oscillator.stop(
            now + .15
          );

        }catch{}

      }

    }

  }catch{}


  element._osc =
    null;

  element._gain =
    null;

  element._pressed =
    false;


  element.classList.remove(
    "active"
  );


  activeVoices.delete(
    element
  );

}


/* =====================================================
   PARAR TODAS
===================================================== */

function stopAllNotes(){

  for(
    const element
    of [...activeVoices]
  ){

    stopNote(
      element
    );

  }

}


/* =====================================================
   LIGAR TECLA
===================================================== */

function bindKey(
  element,
  note,
  noteOctave
){

  element.dataset.note =
    note;

  element.dataset.octave =
    noteOctave;


  element.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      event.stopPropagation();


      unlockAudio();


      if(
        element._pressed
      ){

        return;

      }


      element._pressed =
        true;


      try{

        element.setPointerCapture(
          event.pointerId
        );

      }catch{}


      playNote(
        note,
        noteOctave,
        element
      );

    },
    {
      passive:false
    }
  );


  element.addEventListener(
    "pointerup",
    event => {

      event.preventDefault();

      event.stopPropagation();


      stopNote(
        element
      );

    },
    {
      passive:false
    }
  );


  element.addEventListener(
    "pointercancel",
    event => {

      event.stopPropagation();


      stopNote(
        element
      );

    }
  );


  element.addEventListener(
    "lostpointercapture",
    () => {

      stopNote(
        element
      );

    }
  );

}


/* =====================================================
   CRIAR OITAVA
===================================================== */

function createOctave(
  octaveNumber
){

  const octaveElement =
    document.createElement(
      "div"
    );


  octaveElement.className =
    "octave";


  octaveElement.dataset.octave =
    octaveNumber;


  const whites =
    document.createElement(
      "div"
    );


  whites.className =
    "white-keys";


  const blacks =
    document.createElement(
      "div"
    );


  blacks.className =
    "black-keys";


  /* BRANCAS */

  for(
    let i = 0;
    i < 7;
    i++
  ){

    const note =
      whiteNotes[i];


    const key =
      document.createElement(
        "button"
      );


    key.type =
      "button";


    key.className =
      "white-key";


    key.textContent =
      note +
      octaveNumber;


    bindKey(
      key,
      note,
      octaveNumber
    );


    whites.appendChild(
      key
    );

  }


  /* PRETAS */

  const blackPositions = [

    {
      note:"C#",
      left:"14.2857%"
    },

    {
      note:"D#",
      left:"28.5714%"
    },

    {
      note:"F#",
      left:"57.1428%"
    },

    {
      note:"G#",
      left:"71.4285%"
    },

    {
      note:"A#",
      left:"85.7142%"
    }

  ];


  for(
    const data
    of blackPositions
  ){

    const key =
      document.createElement(
        "button"
      );


    key.type =
      "button";


    key.className =
      "black-key";


    key.style.left =
      data.left;


    bindKey(
      key,
      data.note,
      octaveNumber
    );


    blacks.appendChild(
      key
    );

  }


  octaveElement.appendChild(
    whites
  );


  octaveElement.appendChild(
    blacks
  );


  return octaveElement;

}


/* =====================================================
   RENDERIZAR
===================================================== */

function renderPiano(){

  stopAllNotes();


  keyboard.innerHTML =
    "";


  const octaveList =
    [];


  for(
    let i = 0;
    i < visibleOctaves;
    i++
  ){

    octaveList.push(
      octave + i
    );

  }


  if(inverted){

    octaveList.reverse();

  }


  octaveList.forEach(
    number => {

      keyboard.appendChild(
        createOctave(
          number
        )
      );

    }
  );


  /*
   * C final.
   *
   * Ele entra no último bloco,
   * mantendo a estrutura original.
   */

  const finalOctave =
    inverted
      ? octave
      : octave +
        visibleOctaves;


  const lastOctave =
    keyboard.lastElementChild;


  if(lastOctave){

    const whites =
      lastOctave.querySelector(
        ".white-keys"
      );


    const key =
      document.createElement(
        "button"
      );


    key.type =
      "button";


    key.className =
      "white-key";


    key.textContent =
      "C" +
      finalOctave;


    bindKey(
      key,
      "C",
      finalOctave
    );


    whites.appendChild(
      key
    );

  }


  updateKeyboardSize();


  octaveValue.textContent =
    octave;


  updateViewLabel();


  updateNavigation();

}


/* =====================================================
   TAMANHO DO TECLADO
===================================================== */

function updateKeyboardSize(){

  const width =
    pianoViewport.clientWidth;


  /*
   * A largura visual continua sendo
   * exatamente a largura da tela.
   */

  piano.style.width =
    width +
    "px";


  const octaves =
    keyboard.querySelectorAll(
      ".octave"
    );


  /*
   * Cada bloco ocupa uma parte
   * igual da tela.
   */

  const octaveWidth =
    width /
    visibleOctaves;


  octaves.forEach(
    octaveElement => {

      octaveElement.style.flex =
        "0 0 " +
        octaveWidth +
        "px";

      octaveElement.style.width =
        octaveWidth +
        "px";

    }
  );


  /*
   * Largura das teclas.
   */

  const whiteWidth =
    octaveWidth /
    7;


  const blackWidth =
    whiteWidth *
    .62;


  keyboard
    .querySelectorAll(
      ".black-key"
    )
    .forEach(
      key => {

        key.style.width =
          Math.max(
            5,
            blackWidth
          ) +
          "px";

      }
    );


  /*
   * Texto das teclas.
   */

  let fontSize =
    11;


  if(
    visibleOctaves >= 3
  ){

    fontSize =
      9;

  }


  if(
    visibleOctaves >= 5
  ){

    fontSize =
      7;

  }


  if(
    visibleOctaves >= 7
  ){

    fontSize =
      5;

  }


  keyboard
    .querySelectorAll(
      ".white-key"
    )
    .forEach(
      key => {

        key.style.fontSize =
          fontSize +
          "px";

      }
    );


  /*
   * Mantém o teclado dentro
   * dos limites reais.
   */

  requestAnimationFrame(
    updateNavigation
  );

}


/* =====================================================
   LABEL DE VISÍVEIS
===================================================== */

function updateViewLabel(){

  if(
    visibleOctaves === 1
  ){

    viewValue.textContent =
      "1 oitava";

  }else{

    viewValue.textContent =
      visibleOctaves +
      " oitavas";

  }

}


/* =====================================================
   LARGURA REAL
===================================================== */

function getKeyboardWidth(){

  return keyboard.scrollWidth;

}


/* =====================================================
   NAVEGAÇÃO
===================================================== */

function updateNavigation(){

  const maxOffset =
    Math.max(
      0,
      getKeyboardWidth() -
      pianoViewport.clientWidth
    );


  viewOffset =
    Math.max(
      0,
      Math.min(
        viewOffset,
        maxOffset
      )
    );


  keyboard.style.transform =
    "translate3d(" +
    (-viewOffset) +
    "px,0,0)";


  navLeft.disabled =
    viewOffset <= .5;


  navRight.disabled =
    viewOffset >=
    maxOffset - .5;

}


/* =====================================================
   BOTÃO ESQUERDA
===================================================== */

navLeft.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    event.stopPropagation();


    const amount =
      pianoViewport.clientWidth *
      .6;


    viewOffset -=
      amount;


    updateNavigation();

  },
  {
    passive:false
  }
);


/* =====================================================
   BOTÃO DIREITA
===================================================== */

navRight.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    event.stopPropagation();


    const maxOffset =
      Math.max(
        0,
        getKeyboardWidth() -
        pianoViewport.clientWidth
      );


    const amount =
      pianoViewport.clientWidth *
      .6;


    viewOffset =
      Math.min(
        maxOffset,
        viewOffset +
        amount
      );


    updateNavigation();

  },
  {
    passive:false
  }
);


/* =====================================================
   ARRASTAR
===================================================== */

let dragging =
  false;

let dragPointerId =
  null;

let dragStartX =
  0;

let dragStartOffset =
  0;


pianoViewport.addEventListener(
  "pointerdown",
  event => {

    if(
      event.target.closest(
        ".white-key,.black-key,.nav-button"
      )
    ){

      return;

    }


    const maxOffset =
      Math.max(
        0,
        getKeyboardWidth() -
        pianoViewport.clientWidth
      );


    if(
      maxOffset <= 0
    ){

      return;

    }


    dragging =
      true;


    dragPointerId =
      event.pointerId;


    dragStartX =
      event.clientX;


    dragStartOffset =
      viewOffset;


    try{

      pianoViewport.setPointerCapture(
        event.pointerId
      );

    }catch{}

  },
  {
    passive:false
  }
);


/* =====================================================
   MOVIMENTO
===================================================== */

pianoViewport.addEventListener(
  "pointermove",
  event => {

    if(
      !dragging ||
      event.pointerId !==
      dragPointerId
    ){

      return;

    }


    event.preventDefault();


    const difference =
      event.clientX -
      dragStartX;


    const maxOffset =
      Math.max(
        0,
        getKeyboardWidth() -
        pianoViewport.clientWidth
      );


    viewOffset =
      Math.max(
        0,
        Math.min(
          maxOffset,
          dragStartOffset -
          difference
        )
      );


    updateNavigation();

  },
  {
    passive:false
  }
);


/* =====================================================
   FINALIZAR ARRASTE
===================================================== */

function stopDragging(){

  dragging =
    false;

  dragPointerId =
    null;


  updateNavigation();

}


pianoViewport.addEventListener(
  "pointerup",
  stopDragging
);

pianoViewport.addEventListener(
  "pointercancel",
  stopDragging
);

pianoViewport.addEventListener(
  "lostpointercapture",
  stopDragging
);


/* =====================================================
   VISÍVEIS -
===================================================== */

viewDown.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    event.stopPropagation();


    /*
     * O botão − aumenta a quantidade
     * de teclas/oitavas visíveis,
     * como no código original.
     */

    if(
      visibleOctaves <
      MAX_VISIBLE
    ){

      visibleOctaves++;


      viewOffset =
        0;


      renderPiano();

    }

  },
  {
    passive:false
  }
);


/* =====================================================
   VISÍVEIS +
===================================================== */

viewUp.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    event.stopPropagation();


    if(
      visibleOctaves >
      MIN_VISIBLE
    ){

      visibleOctaves--;


      viewOffset =
        0;


      renderPiano();

    }

  },
  {
    passive:false
  }
);


/* =====================================================
   OITAVA -
===================================================== */

octaveDown.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    event.stopPropagation();


    if(
      octave > 1
    ){

      octave--;


      viewOffset =
        0;


      renderPiano();

    }

  },
  {
    passive:false
  }
);


/* =====================================================
   OITAVA +
===================================================== */

octaveUp.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    event.stopPropagation();


    if(
      octave < 7
    ){

      octave++;


      viewOffset =
        0;


      renderPiano();

    }

  },
  {
    passive:false
  }
);


/* =====================================================
   ORIENTAÇÃO
===================================================== */

function updateOrientation(){

  document.body.classList.remove(
    "vertical",
    "horizontal"
  );


  document.body.classList.add(
    orientation
  );


  verticalBtn.classList.toggle(
    "active",
    orientation ===
      "vertical"
  );


  horizontalBtn.classList.toggle(
    "active",
    orientation ===
      "horizontal"
  );


  rotateBtn.textContent =
    orientation ===
      "vertical"

      ? "↔️ Horizontal"

      : "↕️ Vertical";


  setTimeout(
    () => {

      updateKeyboardSize();

      updateNavigation();

    },
    50
  );

}


/* =====================================================
   BOTÃO HORIZONTAL
===================================================== */

rotateBtn.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    event.stopPropagation();


    orientation =
      orientation ===
        "vertical"

        ? "horizontal"

        : "vertical";


    updateOrientation();

  },
  {
    passive:false
  }
);


/* =====================================================
   VERTICAL
===================================================== */

verticalBtn.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    event.stopPropagation();


    orientation =
      "vertical";


    updateOrientation();

  },
  {
    passive:false
  }
);


/* =====================================================
   HORIZONTAL
===================================================== */

horizontalBtn.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    event.stopPropagation();


    orientation =
      "horizontal";


    updateOrientation();

  },
  {
    passive:false
  }
);


/* =====================================================
   INVERTER
===================================================== */

invertBtn.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    event.stopPropagation();


    inverted =
      !inverted;


    viewOffset =
      0;


    renderPiano();

  },
  {
    passive:false
  }
);


/* =====================================================
   TECLADO FÍSICO
===================================================== */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.repeat
    ){

      return;

    }


    const key =
      event.key.toLowerCase();


    const index =
      computerKeys.indexOf(
        key
      );


    if(
      index === -1
    ){

      return;

    }


    unlockAudio();


    const targets =
      [
        ...keyboard.querySelectorAll(
          ".white-key"
        )
      ];


    const target =
      targets[index];


    if(
      !target
    ){

      return;

    }


    const note =
      target.dataset.note;


    const noteOctave =
      Number(
        target.dataset.octave
      );


    if(
      !note
    ){

      return;

    }


    target._pressed =
      true;


    pressed.set(
      key,
      target
    );


    playNote(
      note,
      noteOctave,
      target
    );

  }
);


/* =====================================================
   SOLTAR TECLADO FÍSICO
===================================================== */

document.addEventListener(
  "keyup",
  event => {

    const key =
      event.key.toLowerCase();


    const target =
      pressed.get(
        key
      );


    if(
      !target
    ){

      return;

    }


    target._pressed =
      false;


    stopNote(
      target
    );


    pressed.delete(
      key
    );

  }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  "resize",
  () => {

    updateKeyboardSize();

    updateNavigation();

  }
);


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

renderPiano();

updateOrientation();

})();

</script>
